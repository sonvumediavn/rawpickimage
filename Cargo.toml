[workspace]
members = ["core", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Image maths are far too slow unoptimised; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
