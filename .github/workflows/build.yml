name: Đóng gói Windows và Mac

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
            out: target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tải mô hình khuôn mặt
        shell: bash
        run: scripts/fetch-models.sh
      - name: Build bộ cài
        working-directory: app
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: SonVu-Raw-Pick-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error
      - name: Đăng lên Releases (khi gắn tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
