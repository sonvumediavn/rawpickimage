[package]
name = "rawpick-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chấm điểm và lọc ảnh RAW/JPEG sự kiện, chạy hoàn toàn bằng CPU"

[lib]
name = "rawpick_core"

[[bin]]
name = "rawpick"
path = "src/bin/rawpick.rs"

[features]
default = ["faces"]
# Face detection (YuNet ONNX) through tract, a pure-Rust inference engine: no GPU, no native runtime to ship.
faces = ["dep:tract-onnx"]

[dependencies]
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tract-onnx = { version = "0.23", optional = true }

[dev-dependencies]
tempfile = "3"
